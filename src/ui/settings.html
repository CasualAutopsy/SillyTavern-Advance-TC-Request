<div id="tcrequest_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Advance TC Request</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content atcr-content">
            <div class="flex-container">
                <input id="tcrequest_enabled" type="checkbox">
                <small>Enable advance TC requests.</small>
                <input id="tcrequest_override" type="checkbox">
                <small>Override ST Payload sampler settings.</small>
            </div>
            <div class="flex-container">
                <span class="flex1">YAML for TC Request:</span>
            </div>

            <textarea id="tcrequest_input" class="text_pole textarea_compact" rows="10"></textarea>
        </div>
    </div>
</div>
